<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel del entrenador</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5FA;--panel:#fff;--ink:#0E1B3D;--muted:#55607A;--line:#D5DBE8;--accent:#E8590C;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0B1531;--panel:#12214A;--ink:#F1F4FC;--muted:#A5B0CB;--line:#26386A;--accent:#FF7A2E;--on:#0B1531}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;padding:20px}
.w{max-width:760px;margin:0 auto}
h1{font:800 2.4rem "Barlow Condensed",sans-serif;margin:0 0 6px}
h2{font:700 1.5rem "Barlow Condensed",sans-serif;margin:0 0 12px}
p{color:var(--muted);margin:0 0 14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin:18px 0}
label{display:block;font-weight:500;margin:12px 0 4px;font-size:.92rem}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{font:700 1rem "DM Sans",sans-serif;background:var(--accent);color:var(--on);border:0;border-radius:6px;padding:11px 20px;cursor:pointer;margin-top:16px}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line);margin:0}
button.s{padding:8px 14px;margin:0}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{margin:0;padding:8px 16px;border-radius:99px}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.it span{overflow:hidden;text-overflow:ellipsis}
#msg{position:sticky;bottom:12px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:8px;margin-top:16px;display:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body><div class="w">
<h1>Panel del entrenador</h1>
<p>Sube vídeos, imágenes, playbooks y análisis a tu web sin tocar código.</p>

<div class="box" id="setup">
  <h2>Conectar con GitHub</h2>
  <p>Solo la primera vez. El token se guarda únicamente en este navegador.</p>
  <label for="repo">Tu repositorio (usuario/nombre)</label><input id="repo" placeholder="tuusuario/web-baloncesto">
  <label for="tok">Token de GitHub</label><input id="tok" type="password" placeholder="github_pat_..." autocomplete="off">
  <button id="go">Conectar</button>
</div>

<div id="app" hidden>
  <nav id="nav" aria-label="Secciones"></nav>
  <div class="box" id="view" aria-live="polite"></div>
  <button class="g s" id="out">Cerrar sesión</button>
</div>
<div id="msg" role="status"></div>
</div>
<script>
var S={
 JUGADAS:{n:"Jugadas",f:[["t","Título"],["d","Descripción o pasos, breve"],["tipo","Enfoque",["Ofensiva","Defensiva"]],["tag","Acceso",["Gratis","Programa"]],["yt","ID de YouTube (déjalo vacío si subes archivo o pones enlace)"],["hg","Enlace en The Hoops Geek (opcional)"]],file:"file",acc:"video/*",fl:"Vídeo desde tu ordenador (opcional)"},
 VIDEOS:{n:"Vídeos",f:[["t","Título"],["d","Descripción"],["tag","Acceso",["Gratis","Programa"]],["yt","ID de YouTube (déjalo vacío si subes un archivo)"]],file:"file",acc:"video/*",fl:"Vídeo desde tu ordenador (opcional)"},
 PLAYBOOKS:{n:"Playbooks",f:[["t","Título"],["d","Descripción"],["n","Número de jugadas","number"],["tag","Acceso",["Gratis","Premium"]],["s","Enfoque",["Ofensiva","Defensiva","Ambas"]],["hg","Enlace del playbook en The Hoops Geek"]]},
 ANALISIS:{n:"Análisis",f:[["t","Título"],["d","Descripción"],["k","Tipo",["Vídeo","Informe","Artículo"]],["tag","Acceso",["Gratis","Premium"]],["s","Enfoque",["Ofensiva","Defensiva","Ambas"]],["url","Enlace (YouTube, artículo...) o sube un archivo abajo"]],file:"url",acc:"*",fl:"Archivo (PDF, vídeo...) (opcional)"},
 GALERIA:{n:"Galería",f:[["t","Pie de foto (opcional)"]],file:"src",acc:"image/*",fl:"Imagen",req:1}
};
var C={},cur="JUGADAS",$=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return ""}}
function say(t){var m=$("msg");m.textContent=t;m.style.display=t?"block":"none"}
function gh(p,m,b){return fetch("https://api.github.com/repos/"+ls("repo")+"/contents/"+p+(m?"":"?t="+Date.now()),{method:m||"GET",headers:{Authorization:"Bearer "+ls("tok"),Accept:"application/vnd.github+json"},body:b?JSON.stringify(b):undefined})}
async function put(p,b,m){var sha,g=await gh(p);if(g.ok)sha=(await g.json()).sha;var r=await gh(p,"PUT",{message:m,content:b,sha:sha});if(!r.ok)throw new Error((await r.json()).message||r.status);return r.json()}
function b64(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result.split(",")[1])};r.onerror=no;r.readAsDataURL(f)})}
function u8(t){return btoa(unescape(encodeURIComponent(t)))}
async function upload(f){var d=/^image/.test(f.type)?"images":/^video/.test(f.type)?"videos":"docs",n=f.name.toLowerCase().replace(/[^a-z0-9._-]/g,"-"),p=d+"/"+n;await put(p,await b64(f),"Subir "+n);return p}
function save(m){return put("content.json",u8(JSON.stringify(C,null,1)),m)}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

async function connect(){
 ls("repo",$("repo").value.trim());ls("tok",$("tok").value.trim());
 say("Conectando...");
 try{
  var r=await gh("content.json");
  if(r.status==401||r.status==403)throw new Error("El token no tiene permiso. Revisa que sea de este repositorio y con permiso Contents: Read and write.");
  if(r.status==404){var t=await gh("");if(!t.ok)throw new Error("No encuentro el repositorio. Revisa el nombre (usuario/nombre) y el token.");C={}}
  else if(r.ok){var j=await r.json();C=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))))}
  else throw new Error("Error "+r.status);
  $("setup").hidden=true;$("app").hidden=false;nav();view(cur);say("");
 }catch(e){say(e.message)}
}
function nav(){
 var n=$("nav");n.innerHTML="";
 Object.keys(S).concat(["FOTO"]).forEach(function(k){
  var b=document.createElement("button");b.className="g";b.textContent=S[k]?S[k].n:"Mi foto";
  b.setAttribute("aria-pressed",k==cur);b.onclick=function(){cur=k;nav();view(k);say("")};n.appendChild(b);
 });
}
function view(k){
 var v=$("view");
 if(k=="FOTO"){
  v.innerHTML='<h2>Mi foto</h2><p>Aparece en la sección "Sobre mí".</p><label for="ff">Imagen</label><input id="ff" type="file" accept="image/*"><button id="sv">Subir foto</button>';
  $("sv").onclick=async function(){var f=$("ff").files[0];if(!f){say("Elige una imagen.");return}await run("Subiendo...",async function(){C.FOTO=await upload(f);await save("Cambiar foto")},k)};
  return;
 }
 var s=S[k],L=C[k]||[];
 var h="<h2>"+s.n+"</h2>"+(L.length?L.map(function(it,i){return '<div class="it"><span>'+esc(it.t||it.src||"(sin título)")+'</span><button class="g s" data-i="'+i+'">Borrar</button></div>'}).join(""):"<p>Todavía no hay nada aquí.</p>");
 h+='<h2 style="margin-top:24px">Añadir</h2>';
 s.f.forEach(function(x,i){
  h+='<label for="f'+i+'">'+x[1]+'</label>'+(Array.isArray(x[2])?'<select id="f'+i+'">'+x[2].map(function(o){return"<option>"+o+"</option>"}).join("")+"</select>":'<input id="f'+i+'" type="'+(x[2]||"text")+'">');
 });
 if(s.file)h+='<label for="ff">'+s.fl+'</label><input id="ff" type="file" accept="'+s.acc+'">';
 h+='<button id="ad">Añadir a la web</button>';
 v.innerHTML=h;
 [].forEach.call(v.querySelectorAll("button[data-i]"),function(b){b.onclick=function(){
  if(!confirm("¿Borrar este elemento de la web?"))return;
  C[k].splice(+b.dataset.i,1);run("Borrando...",function(){return save("Borrar de "+s.n)},k);
 }});
 $("ad").onclick=async function(){
  var it={};s.f.forEach(function(x,i){var val=$("f"+i).value.trim();it[x[0]]=x[2]=="number"?(+val||0):val});
  var fi=$("ff"),f=fi&&fi.files[0];
  if(s.req&&!f){say("Elige una imagen.");return}
  if(!s.req&&!it.t){say("Escribe un título.");return}
  await run("Subiendo... los vídeos grandes pueden tardar unos minutos. No cierres esta página.",async function(){
   if(f)it[s.file]=await upload(f);
   (C[k]=C[k]||[]).push(it);await save("Añadir a "+s.n);
  },k);
 };
}
async function run(msg,fn,k){
 say(msg);
 try{await fn();view(k);say("Listo. En 1 o 2 minutos aparecerá en tu web.")}catch(e){say("Error: "+e.message)}
}
$("go").onclick=connect;
$("out").onclick=function(){ls("tok",null);location.reload()};
(function(){
 var r=ls("repo");
 if(!r&&/github\.io$/.test(location.hostname)){var o=location.hostname.split(".")[0],p=location.pathname.split("/")[1];r=o+"/"+(p&&p!="admin.html"?p:o+".github.io")}
 $("repo").value=r;
 if(ls("tok")){$("tok").value=ls("tok");connect()}
})();
</script>
</body>
</html>
